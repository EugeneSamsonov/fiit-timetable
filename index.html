<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<title>Расписание ФИиИТ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">📅</span>
    <div>
      <div class="title">Расписание ФИиИТ</div>
      <div class="sub" id="subtitle">загрузка…</div>
    </div>
  </div>
</header>

<div class="pickers" id="pickers">
  <div class="pick">
    <label>Курс</label>
    <select id="courseSelect"></select>
  </div>
  <div class="pick">
    <label>Направление</label>
    <select id="groupSelect"></select>
  </div>
</div>
<main id="content">
  <div class="empty">Загрузка расписания…</div>
</main>

<section class="picker-block">
  <div class="section-title"><span class="dot"></span>Посмотреть другой день</div>

  <div class="weekbar">
    <button id="weekToggle" class="week-toggle">Неделя: 1</button>
  </div>

  <div class="day-tabs" id="dayTabs"></div>

  <div id="pickedContent"></div>
</section>

<footer>
  <span id="clock"></span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
