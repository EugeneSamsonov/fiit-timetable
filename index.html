<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0b1120">

<title>Расписание ФИиИТ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">📅</span>
    <div>
      <div class="title">Расписание ФИиИТ</div>
      <div class="sub" id="subtitle">загрузка…</div>
    </div>
    <div class="actions">
      <a href="admin.html" class="btn-icon" title="Редактор расписания">✎</a>
    </div>
  </div>
</header>

<div class="pickers" id="pickers">
  <div class="pick">
    <label>Курс</label>
    <select id="courseSelect"></select>
  </div>
  <div class="pick">
    <label>Направление</label>
    <select id="groupSelect"></select>
  </div>
</div>

<main id="content">
  <div class="empty">Загрузка расписания…</div>
</main>

<section class="picker-block">
  <div class="section-title"><span class="dot"></span>Посмотреть другой день</div>

  <div class="week-switch">
    <button id="weekBtn1" class="week-btn active">1 неделя</button>
    <button id="weekBtn2" class="week-btn">2 неделя</button>
  </div>

  <div class="day-tabs" id="dayTabs"></div>
  <div id="pickedContent"></div>
</section>

<section class="search-block">
  <div class="section-title"><span class="dot"></span>Поиск по расписанию</div>
  <p class="hint">
    Например: <b>4.13</b>, <b>МИЦ</b>, <b>История</b>, <b>Python</b>.
  </p>
  <input type="search" id="searchInput" class="input" placeholder="Что искать?">
  <div id="searchResults" class="search-results"></div>
</section>


<section class="import-block">
  <div class="section-title"><span class="dot"></span>Расписание в JSON</div>
  <p class="hint">
    Скачайте текущее расписание или загрузите своё. Правки сохранятся в браузере.
    Создать своё расписание можно в <a href="admin.html">редакторе</a>.
  </p>
  <div class="import-actions">
    <button id="downloadBtn" class="btn-file">💾 Скачать JSON</button>
    <label class="btn-file">
      📥 Загрузить JSON
      <input type="file" id="importInput" accept=".json,application/json" hidden>
    </label>
    <button id="resetBtn" class="btn-secondary">↺ Сбросить правки</button>
  </div>
  <div id="importStatus" class="import-status"></div>
</section>

<footer>
  <span id="clock"></span>
</footer>
<script src="app.js"></script>
</body>
</html>
