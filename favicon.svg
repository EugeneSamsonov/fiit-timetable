<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Тело календаря -->
  <rect x="4" y="10" width="56" height="50" rx="8" fill="url(#g)"/>

  <!-- Верхняя полоска -->
  <rect x="4" y="10" width="56" height="14" rx="8" fill="url(#top)"/>
  <rect x="4" y="18" width="56" height="6" fill="url(#top)"/>

  <!-- Кольца -->
  <rect x="16" y="4" width="4" height="12" rx="2" fill="#e2e8f0"/>
  <rect x="44" y="4" width="4" height="12" rx="2" fill="#e2e8f0"/>

  <!-- Число 24 (день) -->
  <text x="32" y="50"
        text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif"
        font-size="24"
        font-weight="800"
        fill="#ffffff"
        letter-spacing="-1">24</text>

  <!-- Точка-индикатор снизу -->
  <circle cx="32" cy="56" r="1.5" fill="#93c5fd" opacity="0.7"/>
</svg>
